syntax = "proto3";

package uniwise.course.v1;

option java_multiple_files = true;
option java_package = "com.uniwise.course.v1";
option java_outer_classname = "CourseServiceProto";

// CourseGrpcService - gRPC service inside course-service
service CourseGrpcService {
  // Retrieve course details including price and title
  rpc GetCoursePrice (GetCoursePriceRequest) returns (GetCoursePriceResponse);
}

message GetCoursePriceRequest {
  string course_id = 1;
}

message GetCoursePriceResponse {
  string course_id = 1;
  int64 price = 2; // price in VND
  string title = 3;
  bool is_active = 4;
}
