syntax = "proto3";

package uniwise.course.v1;

option java_multiple_files = true;
option java_package = "com.uniwise.course.v1";
option java_outer_classname = "CourseServiceProto";

// CourseGrpcService - gRPC service inside course-service
service CourseGrpcService {
  // Retrieve course details including price and title
  rpc GetCoursePrice (GetCoursePriceRequest) returns (GetCoursePriceResponse);
  // Check if a user has access to a specific lesson
  rpc CheckLessonAccess (CheckLessonAccessRequest) returns (CheckLessonAccessResponse);
  // Check whether a lesson is a valid upload target owned by an account
  rpc CheckLessonUploadAuthorization (CheckLessonUploadAuthorizationRequest)
      returns (CheckLessonUploadAuthorizationResponse);
}

message GetCoursePriceRequest {
  string course_id = 1;
}

message GetCoursePriceResponse {
  string course_id = 1;
  int64 price = 2; // price in VND
  string title = 3;
  bool is_active = 4;
}

message CheckLessonAccessRequest {
  string account_id = 1;
  string lesson_id = 2;
}

message CheckLessonAccessResponse {
  bool has_access = 1;
}

message CheckLessonUploadAuthorizationRequest {
  string account_id = 1;
  string lesson_id = 2;
}

message CheckLessonUploadAuthorizationResponse {
  bool lesson_exists = 1;
  bool is_owner = 2;
  bool is_video_lesson = 3;
}
