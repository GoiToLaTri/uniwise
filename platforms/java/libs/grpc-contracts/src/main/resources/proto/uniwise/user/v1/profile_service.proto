syntax = "proto3";

package uniwise.user.profile.v1;

option java_multiple_files = true;
option java_package = "com.uniwise.user.profile.v1";
option java_outer_classname = "ProfileServiceProto";

// ProfileService — module profile trong user service.
service ProfileService {
  // Tạo profile mới gắn với một account đã tồn tại.
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);

  // Tra cứu phần thông tin công khai của profile bằng account ID nội bộ.
  rpc GetPublicProfileByAccountId(GetPublicProfileByAccountIdRequest)
      returns (GetPublicProfileByAccountIdResponse);
}

message CreateProfileRequest {
  string name = 1;
  string account_id = 2;
  string email = 3;
}

message CreateProfileResponse {
  Profile profile = 1;
}

message GetPublicProfileByAccountIdRequest {
  string account_id = 1;
}

message GetPublicProfileByAccountIdResponse {
  PublicProfile profile = 1;
}

message PublicProfile {
  string public_id = 1;
  string name = 2;
  string avatar_url = 3;
}

message Profile {
  string id = 1;
  string name = 2;
  string account_id = 3;
  string email = 4;
}
