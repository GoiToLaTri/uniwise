# ============================ Mysql config ============================
spring.datasource.url=jdbc:mysql://mysql:3306/course_service?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=0000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================ Redis config ============================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=0000
spring.data.redis.username=default

# ============================ Server config ============================
server.port=8082
server.servlet.context-path=/course-service
server.forward-headers-strategy=native

# ============================ Jwt Filter config ============================
jwt.public-key-path=classpath:keys/public.pem
jwt.token-header=X-Auth-Token
jwt.enabled=true

# ============================ Grpc config ============================
grpc.server.port=9092

# ============================ RabbitMQ config ============================

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
