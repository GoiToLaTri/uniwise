server.port=8083
server.servlet.context-path=/media-service
server.forward-headers-strategy=native

# ============================ Jwt Filter config ============================
jwt.public-key-path=classpath:keys/public.pem
jwt.token-header=X-Auth-Token
jwt.enabled=true

# ============================ MinIO config ============================
minio.endpoint=http://minio:9000
minio.public-url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=uniwise

# ============================ RabbitMQ config ============================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ============================ Grpc config ============================
grpc.server.port=-1
grpc.clients.course-service.host=course-service
grpc.clients.course-service.port=9092

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
