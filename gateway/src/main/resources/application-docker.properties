springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Route 0: Identity Service
spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://identity-service:8000
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/identity-service/**
# spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/identity-service/(?<segment>.*), /\${segment}

# Route 1: User Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://user-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/user-service/**
# spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/user-service/(?<segment>.*), /\${segment}

# Route 2: Course Service
spring.cloud.gateway.server.webflux.routes[2].id=course-service
