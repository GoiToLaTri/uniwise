spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/media-service/**
# spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/media-service/(?<segment>.*), /\${segment}

# Route 4: Payment Service
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
