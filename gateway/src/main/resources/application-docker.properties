spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payment-service/**

# Route 5: Search Service
spring.cloud.gateway.server.webflux.routes[5].id=search-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://search-service:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/search-service/**