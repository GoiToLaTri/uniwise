services:
  mysql:
    image: mysql:8.0.44-debian
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=0000
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p0000 || exit 1" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - uniwise

  redis:
    image: redis:8.4.0
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=0000
    command: redis-server --requirepass 0000 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "0000", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - uniwise

  redisinsight:
    image: redis/redisinsight:2.70
    # container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - uniwise

  nginx:
    image: nginx/openresty:1.0.0
    build:
      context: .
      dockerfile: ./infrastructure/nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./infrastructure/nginx/lua:/etc/nginx/lua:ro
      - ./certificates/private.pem:/usr/local/openresty/nginx/cert/private.pem:ro
      - ./certificates/public.pem:/usr/local/openresty/nginx/cert/public.pem:ro
    networks:
      - uniwise

  gateway:
    build:
      context: . # thư mục chứa Dockerfile của gateway
      dockerfile: gateway/Dockerfile # tên file Dockerfile (mặc định)
    container_name: gateway-service
    # KHÔNG có ports - không expose ra ngoài host, chỉ truy cập qua nginx
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      # Các biến môi trường khác cho gateway
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY=DEBUG
    # Nếu gateway cần kết nối đến các service khác (ví dụ auth, user...)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"  # dùng để gọi API từ host
    networks:
      - uniwise
    restart: unless-stopped
  
  identity-service:
    build:
      context: .  # context là thư mục root
      dockerfile: platforms/java/services/identity-service/Dockerfile
    container_name: identity-service
    # KHÔNG có ports - không expose ra ngoài host
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8000
      - SPRING_CLOUD_DISCOVERY_ENABLED=false  # nếu dùng gateway mà ko cần discovery
    networks:
      - uniwise
    restart: unless-stopped
    depends_on:
      - user-service

  user-service:
    build:
      context: .  # context là thư mục root
      dockerfile: platforms/java/services/user-service/Dockerfile
    container_name: user-service
    # KHÔNG có ports - không expose ra ngoài host
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
      - SPRING_CLOUD_DISCOVERY_ENABLED=false  # nếu dùng gateway mà ko cần discovery
    networks:
      - uniwise
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  course-service:
    build:
      context: .  # context là thư mục root
      dockerfile: platforms/java/services/course-service/Dockerfile
    container_name: course-service
    # KHÔNG có ports - không expose ra ngoài host
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - SPRING_CLOUD_DISCOVERY_ENABLED=false  # nếu dùng gateway mà ko cần discovery
    networks:
      - uniwise
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  media-service:
    build:
      context: .  # context là thư mục root
      dockerfile: platforms/java/services/media-service/Dockerfile
    container_name: media-service
    # KHÔNG có ports - không expose ra ngoài host
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - SPRING_CLOUD_DISCOVERY_ENABLED=false  # nếu dùng gateway mà ko cần discovery
    networks:
      - uniwise
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  payment-service:
    build:
      context: .  # context là thư mục root
      dockerfile: platforms/java/services/payment-service/Dockerfile
    container_name: payment-service
    # KHÔNG có ports - không expose ra ngoài host
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8085
      - SPRING_CLOUD_DISCOVERY_ENABLED=false  # nếu dùng gateway mà ko cần discovery
    networks:
      - uniwise
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ffmpeg-worker:
    build:
      context: .  # context là thư mục root
      dockerfile: platforms/java/workers/ffmpeg-worker/Dockerfile
    container_name: ffmpeg-worker
    # KHÔNG có ports - không expose ra ngoài host
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./temp:/temp
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - uniwise
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ffmpeg:
        condition: service_started
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - uniwise
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uniwise
    restart: unless-stopped

  ffmpeg:
    image: jrottenberg/ffmpeg:latest
    container_name: ffmpeg-service
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./temp:/temp # Chia sẻ thư mục tạm giữa host (Java app) và container để xử lý file
    networks:
      - uniwise
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - uniwise
    restart: unless-stopped

  kibana:
    image: kibana:8.11.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - uniwise
    restart: unless-stopped
    depends_on:
      - elasticsearch

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:

networks:
  uniwise:
    driver: bridge
    name: "uniwise"
